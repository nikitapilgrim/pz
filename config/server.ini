# Project Zomboid B42.21 server options: template for server-data/Server/<SERVER_NAME>.ini.
# Seeded on the first start by pz-init, which then re-applies every key below on each start.
# Key names and ranges come from the ini written by the 42.21.0 dedicated server itself.
# Not listed here because the image rewrites them from .env on every start: Mods, WorkshopItems, Map,
# DefaultPort, UDPPort, MaxPlayers, Public, PublicName, PVP, PauseEmpty, PingLimit, SteamVAC, Password,
# RCONPassword, RCONPort, SaveWorldEveryMinutes, BackupsCount, BackupsPeriod.

# Friends-only: anyone who knows the server password can create an account.
Open=true
ServerWelcomeMessage=Добро пожаловать на PZ Viewpoint! <LINE> <LINE> Спецназ: спавн [Спецназ] Insurgent Parachute Insertion, профессия Insurgent, без трейта Immune. <LINE> Подопытные: спавн [Лаборатория] Secret Research Base, трейты Bitten + Immune. <LINE> <LINE> Укус для спецназа = гонка с ампутацией (The Only Cure+). <LINE> <LINE> НАСТРОЙКА ОДИН РАЗ: выйдите в главное меню → Моды и включите Spongie's Character Customisation, Tomb's Player Body, Textures [NUDE], Customisation, Compatability, Goth Textures [NUDE], The Only Cure+ - TombBody fit и Knox Wildlife, затем полностью перезапустите игру. Без этого одежда просвечивает телом, а животные выглядят смятыми. Проверка: у персонажа должны быть отдельные пальцы.
GlobalChat=true
DisplayUserName=true
ShowFirstAndLastName=false
SpawnPoint=0,0,0

# PVP is on (.env), but each player toggles it with the safety system.
SafetySystem=true
ShowSafety=true
SafetyToggleTimer=2
SafetyCooldownTimer=3

# 1=Hidden 2=Friends 3=Friends and nearby players 4=Everyone (B42 scale; B41's 3 meant "everyone").
MapRemotePlayerVisibility=4

# Viewpoint mods ship client-only parts; don't kick a friend whose client files differ.
DoLuaChecksum=false

# No router to configure inside Docker in the cloud.
UPnP=false

# Beds work (Viewpoint 3D RVs need it on servers); sleeping stays optional.
SleepAllowed=true
SleepNeeded=false

# Old blood splats disappear after 7 days (when the chunk loads): smaller saves, less memory.
BloodSplatLifespanDays=7

# Safehouses for short sessions and PvP: a claimed house is closed to outsiders (no entry, no looting, no fire)
# while its owner is offline; while the owner is online it is an ordinary house and can be raided.
PlayerSafehouse=true
SafehouseAllowTrepass=false
SafehouseAllowLoot=false
SafehouseAllowFire=false
DisableSafehouseWhenOwnerConnected=true
# Irregular play: a member keeps the safehouse for 30 real days without visiting it (default 144 hours = 6 days).
SafeHouseRemovalTime=720

# Every death is announced in the chat (PvP between factions).
AnnounceDeath=true
